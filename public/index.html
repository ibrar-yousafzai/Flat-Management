<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Flat Management System</title>
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FlatApp">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">

  <!-- Early Theme Initializer -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('flat_theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <!-- Tailwind CSS with Claude AI Editorial Palette -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            claude: {
              50: '#FDFBF7',
              100: '#F7F4EC',
              200: '#EDE7D9',
              300: '#DFD5BF',
              400: '#CDBFA0',
              500: '#D97706',
              600: '#C25E2E',
              700: '#A3481D',
              800: '#7E3412',
              900: '#542009',
            }
          }
        }
      }
    };
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans select-none sm:select-auto">
  <!-- SPA Main Container with Instant Native Splash Loader -->
  <div id="app">
    <div class="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-6 text-center select-none">
      <div class="relative flex items-center justify-center mb-4">
        <div class="w-16 h-16 rounded-3xl bg-indigo-600 text-white flex items-center justify-center text-2xl shadow-xl shadow-indigo-200 animate-pulse">
          <i class="fa-solid fa-building"></i>
        </div>
      </div>
      <h2 class="text-base sm:text-lg font-black text-slate-900 tracking-tight">Flat Management</h2>
      <p class="text-[11px] text-slate-400 mt-0.5">Connecting to Supabase Cloud...</p>
      <div class="mt-4 flex items-center justify-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-indigo-600 animate-bounce" style="animation-delay: 0ms"></span>
        <span class="w-2 h-2 rounded-full bg-indigo-600 animate-bounce" style="animation-delay: 150ms"></span>
        <span class="w-2 h-2 rounded-full bg-indigo-600 animate-bounce" style="animation-delay: 300ms"></span>
      </div>
    </div>
  </div>

  <!-- Global Toast Notifications Container -->
  <div id="toast-container" class="fixed top-4 right-4 sm:top-auto sm:bottom-5 sm:right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-3"></div>

  <!-- View and Controller Scripts -->
  <script src="js/offline-store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/rooms.js"></script>
  <script src="js/views/members.js"></script>
  <script src="js/views/bills.js"></script>
  <script src="js/views/food.js"></script>
  <script src="js/views/payments.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/portal.js"></script>
  <script src="js/views/admins.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/audit.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>

  <!-- PWA Service Worker Registration & Live Auto-Update Detector -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          console.log('[PWA] Service Worker registered:', reg.scope);

          // Detect app updates deployed by developer
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  if (typeof App !== 'undefined' && App.toast) {
                    App.toast('⚡ Flat App updated to latest version! Reloading...', 'info');
                    setTimeout(() => window.location.reload(), 1200);
                  }
                }
              });
            }
          });
        }).catch((err) => {
          console.warn('[PWA] Service Worker registration failed:', err);
        });

        // Smoothly reload when new service worker takes control
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }
  </script>
</body>
</html>
